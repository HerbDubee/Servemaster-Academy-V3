<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80">
  <!-- ServeMaster Academy — horizontal nav wordmark -->
  <!-- Soundwave icon: gold #a17a3f, positioned left -->
  <g fill="#a17a3f" stroke="#a17a3f" stroke-linecap="round">
    <circle cx="2"  cy="24" r="2.2" stroke="none"/>
    <circle cx="8"  cy="24" r="2.2" stroke="none"/>
    <line x1="15" y1="20" x2="15" y2="28" stroke-width="3"/>
    <line x1="22" y1="16" x2="22" y2="32" stroke-width="3"/>
    <line x1="29" y1="11" x2="29" y2="37" stroke-width="3"/>
    <line x1="36" y1="7"  x2="36" y2="41" stroke-width="3"/>
    <line x1="43" y1="11" x2="43" y2="37" stroke-width="3"/>
    <line x1="50" y1="16" x2="50" y2="32" stroke-width="3"/>
    <line x1="57" y1="20" x2="57" y2="28" stroke-width="3"/>
    <circle cx="64" cy="24" r="2.2" stroke="none"/>
    <circle cx="70" cy="24" r="2.2" stroke="none"/>
  </g>
  <!-- ServeMaster — white for dark nav backgrounds -->
  <text x="84" y="37"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="31" font-weight="700"
    fill="#ffffff" letter-spacing="0.2">ServeMaster</text>
  <!-- ACADEMY — gold, tracked -->
  <text x="87" y="61"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="13.5" font-weight="600"
    fill="#a17a3f" letter-spacing="6.5">ACADEMY</text>
</svg>
