<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — ServeMaster Academy</title>
<meta name="description" content="Master fine-dining service with AI role-play, voice practice, and 12 interactive modules. Earn your server certificate and level up your career.">
<meta name="keywords" content="server training, fine dining etiquette, wine pairing for servers, cocktail service, restaurant staff training">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; background: #09090b; color: #fafafa; } .heading { font-family: 'Playfair Display', serif; }</style>
</head>
<body class="min-h-screen flex flex-col">
<nav class="bg-zinc-950 border-b border-zinc-800 px-4 py-4 flex items-center justify-between">
  <a href="/" class="flex items-center gap-2"><span class="text-2xl">🍸</span><span class="heading text-xl font-bold text-white">ServeMaster <span class="text-amber-400">ACADEMY</span></span></a>
  <a href="/login" class="text-zinc-400 hover:text-white text-sm transition-colors">Already have an account? Log in →</a>
</nav>

<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="heading text-3xl font-bold mb-2">Create your account</h1>
      <p class="text-zinc-400">Start training for free — no credit card needed</p>
    </div>

    <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-2xl px-4 py-3 mb-5"></div>

    <a href="/api/auth/google" class="flex items-center justify-center gap-3 w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white font-medium px-6 py-3.5 rounded-2xl transition-colors mb-4">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign up with Google
    </a>

    <div class="flex items-center gap-3 mb-4">
      <div class="flex-1 h-px bg-zinc-800"></div>
      <span class="text-zinc-600 text-sm">or</span>
      <div class="flex-1 h-px bg-zinc-800"></div>
    </div>

    <form id="signup-form" onsubmit="doSignup(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-2">Full name</label>
        <input id="name" type="text" required placeholder="Alex Rivera" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-2">Email address</label>
        <input id="email" type="email" required placeholder="you@example.com" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-2">Password</label>
        <input id="password" type="password" required minlength="6" placeholder="Min. 6 characters" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-2">Experience level</label>
        <select id="level" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white focus:outline-none focus:border-amber-400">
          <option value="New to serving">New to serving (0–6 months)</option>
          <option value="Some experience">Some experience (6 months–2 years)</option>
          <option value="Experienced server">Experienced server (2–5 years)</option>
          <option value="Senior / team lead">Senior / team lead (5+ years)</option>
        </select>
      </div>
      <button type="submit" id="signup-btn" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-bold px-6 py-4 rounded-2xl transition-colors">Create account →</button>
    </form>

    <p class="text-center text-zinc-500 text-sm mt-6">By creating an account you agree to our Terms of Service.</p>
    <p class="text-center text-zinc-500 text-sm mt-2">Already have an account? <a href="/login" class="text-amber-400 hover:text-amber-300 font-medium">Log in</a></p>
  </div>
</main>

<script>
async function doSignup(e) {
  e.preventDefault();
  const btn = document.getElementById('signup-btn');
  const errEl = document.getElementById('error-msg');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        level: document.getElementById('level').value
      })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Registration failed'; errEl.classList.remove('hidden'); return; }
    if (data.token) localStorage.setItem('sma-token', data.token);
    if (data.user) localStorage.setItem('serveMasterUser', JSON.stringify(data.user));
    window.location.href = '/app';
  } catch { errEl.textContent = 'Connection error. Please try again.'; errEl.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = 'Create account →';
}
</script>
</body>
</html>
