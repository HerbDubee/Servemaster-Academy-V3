<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Dashboard – ServeMaster Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    @media (max-width: 1024px) {
      nav {
        flex-direction: column;
        padding: 1rem;
      }
      .nav-links {
        flex-direction: column;
        width: 100%;
        gap: 1rem;
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="flex">
    <!-- Sidebar -->
    <div class="w-72 bg-zinc-900 h-screen p-6 border-r border-amber-900">
      <div class="flex items-center gap-3 mb-12">
        <img src="/logo.png" alt="ServeMaster Academy" class="w-10 h-10 rounded-xl object-cover">
        <div>
          <span class="heading text-2xl">ServeMaster</span>
          <span class="block text-amber-400 text-xs tracking-widest">MANAGER DASHBOARD</span>
        </div>
      </div>
      <nav class="space-y-2">
        <a href="#" class="block py-4 px-6 bg-amber-900 rounded-2xl font-medium">Team Overview</a>
        <a href="#" class="block py-4 px-6 hover:bg-zinc-800 rounded-2xl">Reports</a>
        <a href="#" class="block py-4 px-6 hover:bg-zinc-800 rounded-2xl">Certificates</a>
        <a href="#" class="block py-4 px-6 hover:bg-zinc-800 rounded-2xl">Settings</a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-10">
      <div class="flex justify-between items-center mb-10">
        <div>
          <h1 class="text-4xl font-semibold">Team Overview</h1>
          <p id="team-summary" class="text-zinc-400">Loading...</p>
        </div>
        <button onclick="exportReport()" class="bg-amber-400 hover:bg-amber-300 text-black px-8 py-4 rounded-3xl font-medium flex items-center gap-3">
          <i class="fa-solid fa-download"></i> Export Report
        </button>
      </div>

      <!-- Team Table -->
      <div class="bg-zinc-900 rounded-3xl overflow-hidden">
        <table class="w-full">
          <thead class="border-b border-zinc-800">
            <tr>
              <th class="text-left p-6">Server</th>
              <th class="text-left p-6">Progress</th>
              <th class="text-left p-6">Strongest Module</th>
              <th class="text-left p-6">Status</th>
              <th class="p-6"></th>
            </tr>
          </thead>
          <tbody id="team-table" class="divide-y divide-zinc-800"></tbody>
        </table>
      </div>

      <!-- Charts Row -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-10">
        <div class="bg-zinc-900 rounded-3xl p-8">
          <h3 class="font-semibold mb-6">Team Completion Trend</h3>
          <canvas id="completionChart"></canvas>
        </div>
        <div class="bg-zinc-900 rounded-3xl p-8">
          <h3 class="font-semibold mb-6">Top Modules</h3>
          <canvas id="moduleChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    function authHeaders() {
      const token = localStorage.getItem('token');
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    async function loadTeam() {
      const res = await fetch('/api/team', {
        headers: authHeaders(),
        credentials: 'include'
      });
      if (res.status === 401 || res.status === 403) {
        window.location.href = '/login';
        return [];
      }
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }

    function renderTeamTable(teamData) {
      const tbody = document.getElementById('team-table');
      if (!teamData.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-zinc-500">No team members found.</td></tr>';
        return;
      }
      tbody.innerHTML = teamData.map(member => `
        <tr class="hover:bg-zinc-800 transition">
          <td class="p-6 font-medium">${member.name}</td>
          <td class="p-6">
            <div class="flex items-center gap-3">
              <div class="flex-1 bg-zinc-800 h-2 rounded-full">
                <div class="h-2 bg-amber-400 rounded-full" style="width: ${member.progress}%"></div>
              </div>
              <span class="font-mono text-sm w-10">${member.progress}%</span>
            </div>
          </td>
          <td class="p-6 text-zinc-400">${member.strongest}</td>
          <td class="p-6">
            <span class="px-4 py-1 text-xs rounded-full ${member.status === 'completed' ? 'bg-emerald-900 text-emerald-400' : member.status === 'on-track' ? 'bg-amber-900 text-amber-400' : 'bg-red-900 text-red-400'}">
              ${member.status.toUpperCase()}
            </span>
          </td>
          <td class="p-6 text-right">
            <button onclick="issueCertificate(${member.id})" class="text-amber-400 hover:text-amber-300 text-sm">Issue Certificate</button>
          </td>
        </tr>
      `).join('');
    }

    async function issueCertificate(userId) {
      if (!confirm('Issue completion certificate for this server? This marks all 12 modules as complete.')) return;
      try {
        const res = await fetch('/api/certificate', {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if (data.success) {
          alert(data.message);
          init();
        } else {
          alert('Error: ' + (data.error || 'Unknown error'));
        }
      } catch {
        alert('Failed to issue certificate.');
      }
    }

    async function exportReport() {
      try {
        const res = await fetch('/api/export-report', {
          headers: authHeaders(),
          credentials: 'include'
        });
        if (!res.ok) { alert('Export failed.'); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'team-report.csv';
        a.click();
        URL.revokeObjectURL(url);
      } catch {
        alert('Export failed.');
      }
    }

    async function init() {
      const teamData = await loadTeam();

      const avg = teamData.length
        ? Math.round(teamData.reduce((s, m) => s + m.progress, 0) / teamData.length)
        : 0;
      document.getElementById('team-summary').textContent =
        `${teamData.length} server${teamData.length !== 1 ? 's' : ''} · ${avg}% average completion`;

      renderTeamTable(teamData);

      const moduleCounts = {};
      teamData.forEach(m => {
        if (m.strongest && m.strongest !== 'N/A')
          moduleCounts[m.strongest] = (moduleCounts[m.strongest] || 0) + 1;
      });
      const moduleLabels = Object.keys(moduleCounts).slice(0, 6);
      const moduleValues = moduleLabels.map(l => moduleCounts[l]);

      new Chart(document.getElementById('completionChart'), {
        type: 'line',
        data: {
          labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
          datasets: [{ label: 'Team Average %', data: [42, 61, 78, avg], borderColor: '#d4af37', tension: 0.4 }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { max: 100 } } }
      });

      new Chart(document.getElementById('moduleChart'), {
        type: 'bar',
        data: {
          labels: moduleLabels.length ? moduleLabels : ['Wine', 'Etiquette', 'Upselling', 'Cocktails'],
          datasets: [{ data: moduleValues.length ? moduleValues : [4, 3, 3, 2], backgroundColor: '#d4af37' }]
        },
        options: { plugins: { legend: { display: false } } }
      });
    }

    window.onload = init;
  </script>
<script src="/js/lang.js"></script>
</body>
</html>
