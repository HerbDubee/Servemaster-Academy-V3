<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://t.contentsquare.net/uxa/2e14c5cc7ec76.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1BPWXRYVXS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1BPWXRYVXS');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — ServeMaster Academy</title>
<meta name="description" content="Master fine-dining service with AI role-play, voice practice, and 12 interactive modules. Earn your server certificate and level up your career.">
<meta name="keywords" content="server training, fine dining etiquette, wine pairing for servers, cocktail service, restaurant staff training">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; background: #09090b; color: #fafafa; } .heading { font-family: 'Playfair Display', serif; }</style>
</head>
<body class="min-h-screen flex flex-col">
<nav class="bg-zinc-950 border-b border-zinc-800 px-4 py-4 flex items-center justify-between">
  <a href="/" class="flex items-center gap-2"><img src="/logo.png" alt="ServeMaster Academy" class="w-9 h-9 rounded-xl object-cover"><span class="heading text-xl font-bold text-white">ServeMaster <span class="text-amber-400">ACADEMY</span></span></a>
  <a id="signup-link" href="/signup" class="text-zinc-400 hover:text-white text-sm transition-colors">No account? Sign up →</a>
</nav>

<main class="flex-1 flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">

    <div id="invite-banner" class="hidden bg-amber-400/10 border border-amber-400/40 text-amber-300 text-sm rounded-2xl px-4 py-4 mb-6 flex items-start gap-3">
      <span class="text-xl mt-0.5">🏢</span>
      <div>
        <div class="font-semibold mb-0.5">You've been invited to join a restaurant team!</div>
        <div class="text-amber-200/70">Sign in below and you'll be automatically added to the team.</div>
      </div>
    </div>

    <div class="text-center mb-8">
      <h1 class="heading text-3xl font-bold mb-2">Welcome back</h1>
      <p class="text-zinc-400">Sign in to continue your training</p>
    </div>

    <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-2xl px-4 py-3 mb-5"></div>

    <a id="google-link" href="/api/auth/google" class="flex items-center justify-center gap-3 w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white font-medium px-6 py-3.5 rounded-2xl transition-colors mb-4">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </a>

    <div class="flex items-center gap-3 mb-4">
      <div class="flex-1 h-px bg-zinc-800"></div>
      <span class="text-zinc-600 text-sm">or</span>
      <div class="flex-1 h-px bg-zinc-800"></div>
    </div>

    <form id="login-form" onsubmit="doLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-2">Email address</label>
        <input id="email" type="email" required placeholder="you@example.com" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-2">Password</label>
        <input id="password" type="password" required placeholder="••••••••" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400">
      </div>
      <button type="submit" id="login-btn" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-bold px-6 py-4 rounded-2xl transition-colors">Sign in →</button>
    </form>

    <p class="text-center text-zinc-500 text-sm mt-6">Don't have an account? <a id="signup-link-2" href="/signup" class="text-amber-400 hover:text-amber-300 font-medium">Sign up free</a></p>
  </div>
</main>

<script>
const urlParams = new URLSearchParams(window.location.search);
const joinCode = urlParams.get('join');
const googleToken = urlParams.get('token');
const nextUrl = urlParams.get('next') || '/app';

if (joinCode) {
  localStorage.setItem('sma-pending-join', joinCode);
  document.getElementById('invite-banner').classList.remove('hidden');
  document.getElementById('signup-link').href = `/signup?join=${joinCode}`;
  document.getElementById('signup-link-2').href = `/signup?join=${joinCode}`;
}

document.getElementById('google-link').addEventListener('click', () => {
  if (joinCode) localStorage.setItem('sma-pending-join', joinCode);
  if (nextUrl && nextUrl !== '/app') localStorage.setItem('sma-auth-next', nextUrl);
});

if (googleToken) {
  localStorage.setItem('sma-token', googleToken);
  const storedNext = localStorage.getItem('sma-auth-next');
  const isNewSignup = urlParams.get('signup') === '1';
  let redirectTo = storedNext || nextUrl;
  if (isNewSignup && !redirectTo.includes('signup=1')) redirectTo += (redirectTo.includes('?') ? '&' : '?') + 'signup=1';
  localStorage.removeItem('sma-auth-next');
  const pendingJoin = localStorage.getItem('sma-pending-join');
  if (pendingJoin) {
    fetch('/api/manager/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + googleToken },
      body: JSON.stringify({ inviteCode: pendingJoin })
    }).finally(() => {
      localStorage.removeItem('sma-pending-join');
      window.location.href = redirectTo;
    });
  } else {
    window.location.href = redirectTo;
  }
} else if (urlParams.get('error')) {
  const el = document.getElementById('error-msg');
  el.textContent = 'Google sign-in failed. Please try again or use email.';
  el.classList.remove('hidden');
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Login failed'; errEl.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Sign in →'; return; }
    if (data.token) localStorage.setItem('sma-token', data.token);
    if (data.user) localStorage.setItem('serveMasterUser', JSON.stringify(data.user));

    const code = joinCode || localStorage.getItem('sma-pending-join');
    if (code && data.token) {
      try {
        await fetch('/api/manager/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + data.token },
          body: JSON.stringify({ inviteCode: code })
        });
        localStorage.removeItem('sma-pending-join');
      } catch {}
    }

    window.location.href = nextUrl;
  } catch {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign in →';
  }
}
</script>
</body>
</html>
