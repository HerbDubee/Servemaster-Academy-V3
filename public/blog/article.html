<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Knowledge Centre – ServeMaster Academy</title>
  <meta name="description" id="page-desc" content="ServeMaster Academy — professional hospitality training.">
  <link rel="stylesheet" href="/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #09090b; color: #fafafa; }
    .heading { font-family: 'Montserrat', sans-serif; font-weight: 900; }
    .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #d4d4d8; }
    .prose h2 { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.6rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; color: #fafafa; }
    .prose h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.75rem; margin-bottom: 0.5rem; color: #fafafa; }
    .prose ul { margin-bottom: 1.25rem; padding-left: 1.5rem; color: #d4d4d8; }
    .prose ul li { margin-bottom: 0.5rem; list-style-type: disc; line-height: 1.7; }
    .prose blockquote { border-left: 3px solid #f59e0b; padding-left: 1.25rem; margin: 1.75rem 0; color: #a1a1aa; font-style: italic; }
  </style>
</head>
<body>

<nav class="sticky top-0 z-50 bg-zinc-950/90 backdrop-blur border-b border-zinc-800">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2"><img src="/logo.svg" alt="ServeMaster Academy" class="h-10 w-auto"></a>
    <div class="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-400">
      <a href="/" class="hover:text-white transition-colors">Home</a>
      <a href="/features" class="hover:text-white transition-colors">Academy</a>
      <a href="/blog" class="text-white">Knowledge Centre</a>
      <a href="/app" class="hover:text-white transition-colors">AI Role-Play</a>
      <a href="/pricing" class="hover:text-white transition-colors">Pricing</a>
      <a href="/about" class="hover:text-white transition-colors">About</a>
    </div>
    <div class="flex items-center gap-3">
      <div class="relative" id="lang-selector">
        <button onclick="toggleLangMenu()" id="lang-btn" class="text-zinc-400 hover:text-white text-xs font-bold tracking-widest border border-zinc-700 hover:border-zinc-500 rounded-full px-3 py-1.5 transition-all">EN</button>
        <div id="lang-menu" class="hidden absolute right-0 mt-2 bg-zinc-900 border border-zinc-700 rounded-xl shadow-2xl py-1 z-50 min-w-[120px]">
          <button data-lang-option="en" onclick="setLang('en')" class="block w-full text-left px-4 py-2.5 text-sm text-zinc-300 hover:text-white hover:bg-zinc-800 transition-colors">English</button>
          <button data-lang-option="fr" onclick="setLang('fr')" class="block w-full text-left px-4 py-2.5 text-sm text-zinc-300 hover:text-white hover:bg-zinc-800 transition-colors">Français</button>
          <button data-lang-option="es" onclick="setLang('es')" class="block w-full text-left px-4 py-2.5 text-sm text-zinc-300 hover:text-white hover:bg-zinc-800 transition-colors">Español</button>
        </div>
      </div>
      <a href="/login" class="hidden md:inline text-zinc-400 hover:text-white text-sm font-medium transition-colors" data-i18n="nav_login">Log in</a>
      <a href="/signup" class="hidden md:inline font-bold px-5 py-2.5 rounded-2xl text-sm transition-colors" style="background-color:#FF5E3A;color:#fff;" data-i18n="nav_cta">Get Started Free</a>
    </div>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 py-16" id="article-container">
  <div class="text-center py-20 text-zinc-500">
    <p>Loading article…</p>
  </div>
</main>

<footer class="border-t border-zinc-800 py-10 mt-20">
  <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-zinc-500">
    <div class="flex items-center gap-2">
      <img src="/logo.png" alt="ServeMaster Academy" class="w-7 h-7 rounded-lg object-cover">
      <span class="font-semibold text-zinc-400">ServeMaster Academy</span>
      <span>© 2026</span>
    </div>
    <div class="flex gap-6 flex-wrap justify-center">
      <a href="/privacy" class="hover:text-zinc-300 transition-colors">Privacy</a>
      <a href="/terms" class="hover:text-zinc-300 transition-colors">Terms</a>
      <a href="/contact" class="hover:text-zinc-300 transition-colors">Contact</a>
      <a href="/blog" class="hover:text-zinc-300 transition-colors" data-i18n="nav_blog">Knowledge Centre</a>
      <a href="/managers" class="hover:text-amber-400 transition-colors" data-i18n="nav_managers">For Managers</a>
    </div>
  </div>
</footer>

<script src="/js/content.js"></script>
<script src="/js/lang.js"></script>
<script>
(function() {
  var slug = window.location.pathname.replace(/^\/blog\//, '').replace(/\/+$/, '');
  var articles = window.SMAContent ? window.SMAContent.blogArticles : [];
  var lang = localStorage.getItem('sma-lang') || 'en';
  var article = null;
  for (var i = 0; i < articles.length; i++) {
    if (articles[i].slug === slug) { article = articles[i]; break; }
  }

  var container = document.getElementById('article-container');

  if (!article) {
    document.title = 'Article Not Found – ServeMaster Academy';
    container.innerHTML = '<div class="text-center py-20"><p class="text-zinc-400 mb-4">Article not found.</p><a href="/blog" class="text-amber-400 hover:underline">← Back to Knowledge Centre</a></div>';
    return;
  }

  var title = lang === 'fr' && article.titleFr ? article.titleFr : lang === 'es' && article.titleEs ? article.titleEs : article.title;
  var category = lang === 'fr' && article.categoryFr ? article.categoryFr : lang === 'es' && article.categoryEs ? article.categoryEs : article.category;
  var desc = article.desc || '';

  document.title = title + ' – ServeMaster Academy';
  document.getElementById('page-title').textContent = title + ' – ServeMaster Academy';
  document.getElementById('page-desc').setAttribute('content', desc);

  var backLabel = lang === 'fr' ? '← Retour au Centre de Connaissances' : lang === 'es' ? '← Volver al Centro de Conocimiento' : '← Back to Knowledge Centre';
  var minRead = lang === 'fr' ? 'min de lecture' : lang === 'es' ? 'min de lectura' : 'min read';
  var ctaH = lang === 'fr' ? 'Pratiquez avec des scénarios IA' : lang === 'es' ? 'Practica con escenarios de IA' : 'Practice with AI scenarios';
  var ctaP = lang === 'fr' ? 'ServeMaster Academy — formation gratuite pour commencer.' : lang === 'es' ? 'ServeMaster Academy — formación gratuita para empezar.' : 'ServeMaster Academy trains you with real scenarios. Free to start.';
  var ctaBtn = lang === 'fr' ? 'Commencer gratuitement' : lang === 'es' ? 'Comenzar Gratis' : 'Get Started Free';
  var moreLabel = lang === 'fr' ? 'Plus du Centre de Connaissances' : lang === 'es' ? 'Más del Centro de Conocimiento' : 'More from the Knowledge Centre';

  var relatedArticles = articles.filter(function(a) {
    return a.slug !== slug && a.category === article.category;
  }).slice(0, 3);
  if (relatedArticles.length < 3) {
    var others = articles.filter(function(a) {
      return a.slug !== slug && a.category !== article.category;
    });
    for (var j = 0; j < others.length && relatedArticles.length < 3; j++) {
      relatedArticles.push(others[j]);
    }
  }

  var relatedHTML = relatedArticles.map(function(a) {
    var aTitle = lang === 'fr' && a.titleFr ? a.titleFr : lang === 'es' && a.titleEs ? a.titleEs : a.title;
    var aCat = lang === 'fr' && a.categoryFr ? a.categoryFr : lang === 'es' && a.categoryEs ? a.categoryEs : a.category;
    return '<a href="/blog/' + a.slug + '" class="bg-zinc-900 rounded-2xl p-5 hover:border-amber-900 border border-zinc-800 transition-colors block"><p class="text-zinc-400 text-xs mb-2 uppercase tracking-wide">' + aCat + '</p><p class="font-semibold text-white">' + aTitle + '</p></a>';
  }).join('');

  container.innerHTML =
    '<a href="/blog" class="text-amber-400 text-sm hover:underline">' + backLabel + '</a>' +
    '<div class="mt-8 mb-12">' +
      '<p class="text-amber-400 text-sm font-medium uppercase tracking-widest mb-4">' + category + '</p>' +
      '<h1 class="heading text-4xl md:text-5xl font-black leading-tight mb-6">' + title + '</h1>' +
      '<p class="text-zinc-400 text-lg">' + desc + '</p>' +
      '<div class="flex items-center gap-3 mt-6 text-sm text-zinc-500"><span>ServeMaster Academy</span><span>·</span><span>' + article.mins + ' ' + minRead + '</span></div>' +
    '</div>' +
    '<div id="article-body" class="prose text-zinc-400 text-center py-12"><p>Loading content…</p></div>' +
    '<div class="mt-16 bg-zinc-900 border border-amber-900 rounded-3xl p-10 text-center">' +
      '<h3 class="heading text-2xl font-bold mb-3">' + ctaH + '</h3>' +
      '<p class="text-zinc-400 mb-6">' + ctaP + '</p>' +
      '<a href="/signup" class="inline-block bg-amber-400 hover:bg-amber-300 text-black font-bold px-10 py-4 rounded-2xl transition-colors">' + ctaBtn + '</a>' +
    '</div>' +
    '<div class="mt-16 border-t border-zinc-800 pt-10">' +
      '<p class="text-zinc-500 text-sm mb-6">' + moreLabel + '</p>' +
      '<div class="grid md:grid-cols-3 gap-4 text-sm">' + relatedHTML + '</div>' +
    '</div>';

  fetch('/blog/' + slug + '.html')
    .then(function(r) { return r.ok ? r.text() : null; })
    .then(function(html) {
      if (!html) return;
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var prose = doc.querySelector('.prose');
      if (prose) {
        document.getElementById('article-body').innerHTML = prose.innerHTML;
      }
    })
    .catch(function() {});
})();
</script>
</body>
</html>
