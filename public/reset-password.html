<!DOCTYPE html>
<html lang="en">
<head>
  <script async defer src="https://t.contentsquare.net/uxa/2e14c5cc7ec76.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1BPWXRYVXS"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1BPWXRYVXS');</script>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ServeMaster Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; background: #09090b; color: #fafafa; } .heading { font-family: 'Playfair Display', serif; }</style>
</head>
<body class="min-h-screen flex flex-col">
<nav class="bg-zinc-950 border-b border-zinc-800 px-4 py-4 flex items-center justify-between">
  <a href="/" class="flex items-center gap-2"><img src="/logo.png" alt="ServeMaster Academy" class="w-9 h-9 rounded-xl object-cover"><span class="heading text-xl font-bold text-white">ServeMaster <span class="text-amber-400">ACADEMY</span></span></a>
</nav>

<main class="flex-1 flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <div id="invalid-token" class="hidden text-center py-8">
      <div class="text-4xl mb-4">⛔</div>
      <h1 class="heading text-2xl font-bold mb-3">Link invalid or expired</h1>
      <p class="text-zinc-400 mb-6">This reset link has expired or already been used. Request a new one below.</p>
      <a href="/forgot-password" class="bg-amber-400 hover:bg-amber-300 text-black font-bold px-6 py-3 rounded-2xl transition-colors inline-block">Request new link</a>
    </div>

    <div id="reset-panel">
      <div class="text-center mb-8">
        <div class="text-4xl mb-4">🔐</div>
        <h1 class="heading text-3xl font-bold mb-2">Choose a new password</h1>
        <p class="text-zinc-400">Make it something memorable.</p>
      </div>

      <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-2xl px-4 py-3 mb-5"></div>

      <form id="reset-form" onsubmit="doReset(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">New password</label>
          <input id="password" type="password" required minlength="8" placeholder="At least 8 characters" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">Confirm password</label>
          <input id="password2" type="password" required minlength="8" placeholder="••••••••" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400">
        </div>
        <button type="submit" id="submit-btn" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-bold px-6 py-4 rounded-2xl transition-colors">Reset Password →</button>
      </form>
    </div>

    <p class="text-center text-zinc-500 text-sm mt-6"><a href="/login" class="text-amber-400 hover:text-amber-300 font-medium">← Back to login</a></p>
  </div>
</main>

<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('reset-panel').classList.add('hidden');
  document.getElementById('invalid-token').classList.remove('hidden');
}

async function doReset(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  const pw = document.getElementById('password').value;
  const pw2 = document.getElementById('password2').value;
  errEl.classList.add('hidden');
  if (pw !== pw2) {
    errEl.textContent = 'Passwords do not match.';
    errEl.classList.remove('hidden');
    return;
  }
  btn.disabled = true; btn.textContent = 'Updating...';
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, newPassword: pw })
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Reset failed. The link may have expired.';
      errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Reset Password →';
      if (res.status === 400 && data.expired) {
        document.getElementById('reset-panel').classList.add('hidden');
        document.getElementById('invalid-token').classList.remove('hidden');
      }
      return;
    }
    window.location.href = '/login?reset=1';
  } catch {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Reset Password →';
  }
}
</script>
</body>
</html>
