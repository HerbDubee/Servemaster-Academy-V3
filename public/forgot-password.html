<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://t.contentsquare.net/uxa/2e14c5cc7ec76.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1BPWXRYVXS"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1BPWXRYVXS');</script>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — ServeMaster Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; background: #09090b; color: #fafafa; } .heading { font-family: 'Playfair Display', serif; }</style>
</head>
<body class="min-h-screen flex flex-col">
<nav class="bg-zinc-950 border-b border-zinc-800 px-4 py-4 flex items-center justify-between">
  <a href="/" class="flex items-center gap-2"><img src="/logo.png" alt="ServeMaster Academy" class="w-9 h-9 rounded-xl object-cover"><span class="heading text-xl font-bold text-white">ServeMaster <span class="text-amber-400">ACADEMY</span></span></a>
</nav>

<main class="flex-1 flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-4xl mb-4">🔑</div>
      <h1 class="heading text-3xl font-bold mb-2">Forgot your password?</h1>
      <p class="text-zinc-400">Enter your account email and we'll send you a reset link.</p>
    </div>

    <div id="success-msg" class="hidden bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-sm rounded-2xl px-4 py-4 mb-5 text-center">
      If that email is registered, a reset link is on its way. Check your inbox (and spam folder).
    </div>
    <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-2xl px-4 py-3 mb-5"></div>

    <form id="forgot-form" onsubmit="doForgot(event)" class="space-y-4" id="forgot-form-el">
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-2">Email address</label>
        <input id="email" type="email" required placeholder="you@example.com" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-400">
      </div>
      <button type="submit" id="submit-btn" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-bold px-6 py-4 rounded-2xl transition-colors">Send reset link →</button>
    </form>

    <p class="text-center text-zinc-500 text-sm mt-6"><a href="/login" class="text-amber-400 hover:text-amber-300 font-medium">← Back to login</a></p>
  </div>
</main>

<script>
async function doForgot(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  const successEl = document.getElementById('success-msg');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await fetch('/api/forgot-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value })
    });
    document.getElementById('forgot-form').classList.add('hidden');
    successEl.classList.remove('hidden');
  } catch {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Send reset link →';
  }
}
</script>
</body>
</html>
